[versions]
agp = "9.5.0"
kotlin = "2.4.21"
activityCompose = "1.13.0"
composeMaterial3 = "1.5.0-rc01"
ktlint = "1.8.0"
ktlintGradle = "14.2.0"
detekt = "2.0.0-alpha.6"
detektCompose = "0.6.8"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.12.0"
lifecycle = "2.11.0"
androidxAnnotation = "1.11.0"
gson = "2.15.0"
zxing = "3.5.4"
camerax = "1.6.2"

[libraries]
androidxActivityCompose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidxComposeMaterial3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
androidxLifecycleViewmodelCompose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidxLifecycleRuntimeCompose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidxLifecycleLivedataCore = { group = "androidx.lifecycle", name = "lifecycle-livedata-core", version.ref = "lifecycle" }
androidxAnnotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
kotlinxCoroutinesCore = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesAndroid = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesTest = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinxSerializationJson = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
cameraCamera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
cameraLifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
cameraView = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
zxingCore = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
ktlintCli = { group = "com.pinterest.ktlint", name = "ktlint-cli", version.ref = "ktlint" }
detektCompose = { group = "io.nlopez.compose.rules", name = "detekt", version.ref = "detektCompose" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
